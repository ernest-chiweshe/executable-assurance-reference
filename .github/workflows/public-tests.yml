# Builds the release files from this commit and runs the full public test suite exactly as
# REPRODUCE.txt describes for Linux: Python 3.14, PostgreSQL 18, an isolated loopback cluster.
name: public tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PostgreSQL 18
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-18
          /usr/lib/postgresql/18/bin/postgres --version
      - name: Build the release files
        run: |
          python -m pip install -q build==1.3.0
          python -m build --outdir "$RUNNER_TEMP/dist" .
          sha256sum "$RUNNER_TEMP"/dist/*
      - name: Install as REPRODUCE.txt describes
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -r "$GITHUB_WORKSPACE/requirements-tested.txt"
          .venv/bin/python -m pip install -q --no-deps dist/*.whl
          tar -xzf dist/*.tar.gz
      - name: Run the public suite
        working-directory: ${{ runner.temp }}
        run: |
          PY="$PWD/.venv/bin/python"
          SRC="$(ls -d "$PWD"/executable_assurance_reference-*/)"
          RUN="$PWD/qualification"
          mkdir -p "$RUN"
          "$PY" -I "$SRC/scripts/isolated_postgres.py" --pg-bin /usr/lib/postgresql/18/bin --work-root "$RUN/pg" -- \
            "$PY" -u -I "$SRC/scripts/run_public_tests.py" -q --public-report "$RUN/PUBLIC-RESULT.json" \
            --basetemp "$RUN/tests" --junitxml "$RUN/pytest.xml" \
            --source-adaptation-manifest=docs/provenance/security-rc6/adaptations.json \
            --source-adaptation-sha256=f0e587b27319f7ea7cdaa9e91b581af85e6b207a52ada41175b1a2cf7a88c137
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-test-results
          path: |
            ${{ runner.temp }}/qualification/pytest.xml
            ${{ runner.temp }}/qualification/PUBLIC-RESULT.json
            ${{ runner.temp }}/qualification/pg/RESULT.json
          if-no-files-found: warn
